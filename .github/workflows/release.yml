name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options: [release, rc, beta, alpha]
      base_version:
        description: "Override MAJOR.MINOR.PATCH (blank = keep current)"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'zulu'
          server-id: github

      # Same "tags are the source of truth for next N" scheme as every other component. plugin.json's
      # own "version" is what publish-plugin.yml/publish_plugin.py read at marketplace-publish time;
      # pom.xml's <revision> is bumped in lockstep so ares-plugin-bughunting-hackerone/-intigriti can
      # pin their own <ares-plugin-bughunting.version> to the exact same number.
      - name: Compute release version
        id: ver
        run: |
          set -euo pipefail
          CURRENT="$(python3 -c 'import json; print(json.load(open("src/main/resources/plugin.json"))["version"])')"
          MMP="${{ inputs.base_version }}"
          if [ -z "$MMP" ]; then
            MMP="$(echo "$CURRENT" | sed -E 's/-.*$//')"
          fi
          CHANNEL="${{ inputs.channel }}"
          if [ "$CHANNEL" = "release" ]; then
            VERSION="$MMP"
            TAG="v${MMP}"
          else
            PREFIX="v${MMP}-${CHANNEL}"
            LAST="$(git tag -l "${PREFIX}*" | sed -E "s/^${PREFIX}//" | sort -n | tail -1)"
            NEXT=$(( ${LAST:-0} + 1 ))
            VERSION="${MMP}-${CHANNEL}${NEXT}"
            TAG="${PREFIX}${NEXT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Bump pom.xml + plugin.json, commit, and tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i -E "s#<revision>[^<]+</revision>#<revision>${VERSION}</revision>#" pom.xml
          python3 - "$VERSION" <<'EOF'
          import json, sys
          path = "src/main/resources/plugin.json"
          manifest = json.load(open(path))
          manifest["version"] = sys.argv[1]
          json.dump(manifest, open(path, "w"), indent=2)
          open(path, "a").write("\n")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pom.xml src/main/resources/plugin.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.ver.outputs.tag }}"
          else
            echo "Already at ${VERSION} — tagging current HEAD without a new commit"
          fi
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main "${{ steps.ver.outputs.tag }}"

      # Publishes the GitHub Package at the exact release version (not just +githash like ci.yml)
      # so ares-plugin-bughunting-hackerone/-intigriti can pin a stable <ares-plugin-bughunting.version>
      # to it.
      - name: Build, test, and publish release package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -ntp deploy

      # The tag push above uses the default GITHUB_TOKEN, which GitHub Actions deliberately does
      # not let trigger other workflows (anti-recursion guard) — so publish-plugin.yml's own
      # `push: tags:` trigger never fires from this. Dispatching it explicitly via the API is a
      # distinct, legitimate trigger that isn't subject to that restriction.
      - name: Fire the marketplace publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-plugin.yml --ref "${{ steps.ver.outputs.tag }}"
